[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "penetration-llm"
description = "Local-first terminal chat assistant for authorized security testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isaac Limb" }]
keywords = ["pentest", "security", "llm", "local-first", "offline", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
  "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://isaaclimb.com/projects/penetration-llm.html"
Source = "https://github.com/isaaclimb/penetration-llm"

[project.scripts]
penetration-llm = "pentest_llm.cli:main"
pentest-llm = "pentest_llm.cli:main"

[tool.hatch.version]
path = "src/pentest_llm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pentest_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# These carry long content strings (the model's JSON example, methodology prose)
# that read better unwrapped; E501 applies to code lines everywhere else.
"src/pentest_llm/llm.py" = ["E501"]
"src/pentest_llm/methodology.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["pentest_llm"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
